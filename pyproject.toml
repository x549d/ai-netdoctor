[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-netdoctor"
version = "0.1.0"
description = "A small CLI for diagnosing AI API connectivity and HTTP proxy issues"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["httpx>=0.28.1,<0.29"]

[project.scripts]
ai-netdoctor = "ai_netdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
