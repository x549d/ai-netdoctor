[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-netdoctor"
version = "0.1.2"
description = "A small CLI for diagnosing AI API connectivity and HTTP proxy issues"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28.1,<0.29"]

[project.urls]
Repository = "https://github.com/x549d/ai-netdoctor"
Issues = "https://github.com/x549d/ai-netdoctor/issues"
Changelog = "https://github.com/x549d/ai-netdoctor/blob/main/CHANGELOG.md"

[project.scripts]
ai-netdoctor = "ai_netdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
