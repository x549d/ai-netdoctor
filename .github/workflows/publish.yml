name: Package and publish
on:
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested distributions to PyPI
        type: boolean
        default: false
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the installed wheel
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -v
          python -m ai_netdoctor --version
          ai-netdoctor --version
          python - <<'PY'
          from importlib.metadata import distribution
          from pathlib import Path
          import tomllib
          import ai_netdoctor

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          package = distribution(project["name"])
          assert package.version == project["version"] == ai_netdoctor.__version__
          assert package.metadata["License-Expression"] == "MIT"
          assert package.metadata.get_all("License-File") == ["LICENSE"]
          assert any(path.as_posix().endswith("/licenses/LICENSE") for path in package.files)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ai-netdoctor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
