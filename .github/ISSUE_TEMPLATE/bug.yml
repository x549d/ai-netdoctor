name: Bug report / 故障报告
description: Report a reproducible problem with AI NetDoctor / 提交可复现的问题
body:
  - type: markdown
    attributes:
      value: Use [private vulnerability reporting](https://github.com/x549d/ai-netdoctor/security/advisories/new) for security issues. 安全漏洞请通过私密入口报告。
  - type: input
    id: environment
    attributes:
      label: OS, Python and AI NetDoctor versions / 系统、Python 与工具版本
      placeholder: Windows 11, Python 3.13, AI NetDoctor 0.1.2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the provider, direct or proxy mode, and a redacted command. 请说明服务商、直连或代理模式，并提供脱敏命令。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际结果
      description: A redacted stage name and HTTP status are usually enough. 通常只需提供脱敏后的故障阶段和 HTTP 状态码。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting / 提交前
      options:
        - label: I removed credentials and private network details. 我已移除凭证和私有网络信息。
          required: true
